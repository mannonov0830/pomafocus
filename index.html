<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./img/Code_Generated_Image.png  "
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
      integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>PomaFocus</title>
  </head>
  <body>
    <section class="navbar">
      <section class="nav container">
        <h1>
          <img src="./img/Code_Generated_Image.png" alt="" />

          PomoFocus
        </h1>

        <div class="flex">
          <div class="report drop" id="reportBtn">
            <i class="ri-funds-box-fill"></i>

            Report

            <div class="dawn" id="reportMenu">
              <span class="closeBtn" id="closeBtn">
                <i class="ri-xrp-fill"></i>
              </span>

              <div class="dawnFlex">
                <div class="btnFlex">
                  <h4>
                    <i class="ri-line-chart-line"></i>

                    Summary
                  </h4>

                  <h4>
                    <i class="ri-menu-line"></i>

                    Detail
                  </h4>

                  <h4>
                    <i class="ri-vip-crown-2-line"></i>

                    Ranking
                  </h4>
                </div>
              </div>

              <h3>
                Activity Summary

                <div></div>
              </h3>

              <p>* This report will be available when you are logged in</p>

              <img src="./img/gemini-svg.svg" alt="" />

              <h5>
                Focus Hours

                <div></div>
              </h5>

              <div class="weekBtn">
                <button>Week</button>

                <button>Month</button>

                <button>
                  <i class="ri-git-repository-private-fill"></i>Year
                </button>
              </div>
            </div>
          </div>

          <div class="report">
            <i class="ri-settings-3-fill"></i>

            Setting
          </div>

          <div class="report" id="reportBtnn">
            <i class="ri-shield-user-fill"></i>

            Sing in

            <div class="dawnn" id="reportMenuu">
              <h4>
                <img src="./img/image.png" alt="" />

                Sinnup with Google
              </h4>

              <div class="hrFlex">
                <div class="hr"></div>

                <p>or</p>

                <div class="hr"></div>
              </div>

              <form action="">
                <label for="Email">Email</label>

                <input type="email" placeholder="Email kiriting" />

                <button>Sing up with Email</button>
              </form>
            </div>
          </div>

          <div class="menu" id="dropMenu">
            <i class="ri-more-2-fill"></i>

            <div class="dawnMenu" id="dawnMenu">
              <h5>
                <i class="ri-login-box-fill"></i>

                Login
              </h5>

              <h5>
                <i class="ri-vip-crown-2-fill"></i>

                Premium
              </h5>

              <h5>
                <i class="ri-keyboard-box-fill"></i>

                Shortcuts
              </h5>
            </div>
          </div>
        </div>
      </section>

      <section class="cartPomo">
        <div class="pomaText">
          <h4>Pomodora</h4>

          <h4>Short Break</h4>

          <h4>Long Break</h4>
        </div>

        <h3 id="time">00 : 00</h3>

        <div class="btnpoma">
          <button class="start">Start</button>
        </div>
      </section>

      <section class="tasks container">
        <div>
          <h2>#5</h2>

          <p>Time to focus!</p>

          <div class="btnTasks">
            <h4>Tasks</h4>

            <i class="ri-more-2-fill"></i>
          </div>

          <div class="tasks_input">
            <span>+</span>
            <h4>Add Tasks</h4>
          </div>
        </div>
      </section>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
